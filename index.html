<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<title>Puzzelheld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Puzzelheld v1. Kid part: dark glowing game UI, calm light puzzle board. Parent part: quiet light dashboard.
   One committed look; every colour explicit. */
:root {
  color-scheme: light;
  --night: #0b1330; --night2: #15224d; --night3: #22306a;
  --red: #ff3355; --red-deep: #b5122f; --cyan: #38e1ff; --gold: #ffcf3d; --mint: #3ddc97;
  --soft: #b8c3e6;
  --ink: #17172b; --paper: #eef1f8; --panel: #ffffff; --muted: #5b6078; --line: #d5dcec;
  --ok: #1b7a46; --okbg: #e9f6ee; --warn: #8a5800; --warnbg: #fff4dc;
  --display: "Russo One", "Arial Black", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.45; background: var(--night); color: #fff; }
body.parent { background: var(--paper); color: var(--ink); }
button { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { min-height: 100vh; }
.kid { min-height: 100vh; background: radial-gradient(120% 70% at 80% 0%, var(--night3) 0%, var(--night2) 40%, var(--night) 100%); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.center { text-align: center; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* HUD */
.hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(56,225,255,.25); }
.badge { width: 50px; height: 50px; flex: none; border-radius: 14px; background: linear-gradient(145deg, var(--red), var(--red-deep)); box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(255,51,85,.5); overflow: hidden; display: grid; place-items: center; }
.badge svg { width: 100%; height: 100%; }
.who { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.who small { font-size: 12px; color: var(--cyan); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.who strong { font-family: var(--display); font-weight: 400; font-size: 21px; }
.xp { flex: 1 1 220px; min-width: 160px; display: flex; flex-direction: column; gap: 4px; }
.xp .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.xp .lab b { color: var(--gold); }
.bar { height: 14px; background: rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--cyan), #8af1ff); box-shadow: 0 0 12px var(--cyan); transition: width .6s ease; }
.coins { display: flex; align-items: center; gap: 8px; background: rgba(255,207,61,.14); border: 1px solid rgba(255,207,61,.6); border-radius: 999px; padding: 4px 14px 4px 5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
.coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b0, var(--gold) 55%, #c98f00); display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #6b4a00; flex: none; }
.hudbtn { border: 0; background: rgba(255,255,255,.08); color: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.hudbtn:hover { background: rgba(255,255,255,.16); }

.cta { font-family: var(--display); font-size: 21px; background: linear-gradient(180deg, #ff5573, var(--red) 50%, var(--red-deep)); color: #fff; border: 0; border-radius: 14px; padding: 12px 26px; cursor: pointer; box-shadow: 0 6px 0 #7a0a1f, 0 0 22px rgba(255,51,85,.45); }
.cta:active { transform: translateY(3px); box-shadow: 0 3px 0 #7a0a1f; }
.cta[disabled] { opacity: .45; cursor: default; }
.ghost { border: 0; background: rgba(56,225,255,.12); color: #fff; box-shadow: inset 0 0 0 1px var(--cyan); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700; }

/* start + forms */
.logo { font-family: var(--display); font-size: clamp(40px, 8vw, 64px); line-height: 1; }
.logo span { color: var(--red); text-shadow: 0 0 18px rgba(255,51,85,.6); }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
.who-card { border: 0; color: #fff; cursor: pointer; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(56,225,255,.3); }
.who-card:hover, .who-card.sel { box-shadow: inset 0 0 0 3px var(--cyan), 0 0 24px rgba(56,225,255,.3); }
.who-card .big { width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; overflow: hidden; }
.who-card .big.k { background: linear-gradient(145deg, var(--red), var(--red-deep)); box-shadow: 0 0 0 3px var(--gold); }
.who-card .big.p { background: #2a3870; }
.who-card .big.n { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(56,225,255,.5); }
.pselect { display: inline-flex; gap: 6px; align-items: center; }
.pselect select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); font: inherit; }
.who-card .big svg { width: 100%; height: 100%; }
.who-card strong { font-family: var(--display); font-weight: 400; font-size: 22px; }
.form { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 420px; width: 100%; margin: 0 auto; }
.form input[type=password], .form input[type=text], .form input[type=email] { font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(56,225,255,.4); width: 100%; }
.form label.chk { display: flex; gap: 8px; align-items: center; color: var(--soft); font-size: 15px; }
.err { color: #ffb3c0; font-weight: 700; min-height: 1.4em; }
.muted { color: var(--soft); }

/* hero builder */
.builder { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 720px) { .builder { grid-template-columns: minmax(0, 1fr); } }
.stage { border-radius: 18px; background: radial-gradient(60% 50% at 50% 55%, rgba(56,225,255,.35), transparent 70%), rgba(255,255,255,.04); display: grid; place-items: center; padding: 10px; }
.stage svg { width: 100%; max-width: 260px; }
.choices { display: flex; flex-direction: column; gap: 16px; }
.choice h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin-bottom: 8px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.sw.on { box-shadow: 0 0 0 3px var(--night), 0 0 0 6px var(--cyan); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 0; cursor: pointer; border-radius: 999px; padding: 8px 16px; background: rgba(255,255,255,.08); color: #fff; font-weight: 700; }
.chip.on { background: var(--cyan); color: var(--night); }

/* map */
.map > svg { width: 100%; height: auto; display: block; border-radius: 16px; }
.map .node { cursor: pointer; }
.map .node:focus-visible circle { stroke: var(--gold); stroke-width: 6; }
.mapfoot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.wlist { display: flex; gap: 8px; flex-wrap: wrap; }
.wchip { border-radius: 12px; padding: 6px 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); font-size: 13px; display: flex; flex-direction: column; line-height: 1.25; }
.wchip b { font-family: var(--display); font-weight: 400; font-size: 14px; }
.wchip span { color: var(--soft); }
.wchip.done { border-color: rgba(255,207,61,.6); }
.wchip.lock { opacity: .55; }
.banner { border-radius: 14px; padding: 12px 16px; background: linear-gradient(90deg, rgba(255,207,61,.22), rgba(255,207,61,.06)); box-shadow: inset 0 0 0 1px rgba(255,207,61,.6); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* play */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { border-radius: 999px; padding: 3px 14px; font-weight: 700; font-size: 13px; letter-spacing: .08em; background: rgba(255,255,255,.08); color: var(--soft); }
.steps span.on { background: var(--gold); color: var(--night); box-shadow: 0 0 14px rgba(255,207,61,.5); }
.task { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
.iconbtn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(56,225,255,.15); box-shadow: inset 0 0 0 1px var(--cyan); display: grid; place-items: center; cursor: pointer; flex: none; }
.board { background: #f6f8ff; color: var(--ink); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.qrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cellbox { background: #fff; border-radius: 10px; box-shadow: 0 0 0 2px #dfe5f5; display: grid; place-items: center; line-height: 0; }
.cellbox svg { width: 64px; height: 64px; }
.cellbox.q { background: #fff6d6; box-shadow: 0 0 0 2px var(--gold); }
.matrix { display: grid; gap: 6px; width: fit-content; }
.matrix .cellbox svg { width: 72px; height: 72px; }
.op { color: var(--muted); font-weight: 700; font-size: 14px; }
.bigq { font-size: 22px; font-weight: 700; line-height: 1.4; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; }
.opt { border: 0; border-radius: 14px; background: #fff; box-shadow: 0 0 0 2px #cfd8ef, 0 5px 0 #cfd8ef; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-weight: 700; color: var(--ink); min-width: 64px; transition: transform .1s; }
.opt:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 0 0 2px #8fa3d9, 0 7px 0 #cfd8ef; }
.opt svg { width: 64px; height: 64px; }
.opt.txt { font-size: 20px; padding: 12px 20px; min-width: 80px; }
.opt.gone { opacity: .25; box-shadow: 0 0 0 2px #cfd8ef; cursor: default; }
.opt.right { box-shadow: 0 0 0 4px var(--mint), 0 5px 0 #9be6c4; }
.opt .l { font-size: 13px; color: var(--muted); }
.bal { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bal .one { background: #fff; border-radius: 12px; box-shadow: 0 0 0 2px #dfe5f5; padding: 4px; line-height: 0; }
.bal .one.ask { box-shadow: 0 0 0 3px var(--gold); }
.bal svg { width: 220px; max-width: 100%; height: auto; }
.lg { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.lg ol { margin: 0; padding-left: 22px; font-size: 17px; display: flex; flex-direction: column; gap: 4px; max-width: 46ch; }
.lg table { border-collapse: collapse; }
.lg th, .lg td { border: 2px solid #9aa6c6; padding: 4px 8px; text-align: center; font-size: 15px; }
.lg td button { width: 40px; height: 34px; border: 0; background: #fff; cursor: pointer; font-size: 20px; font-weight: 700; }
.lg td button.x { color: #c0392b; }
.lg td button.v { color: var(--ok); }
.hintrow { display: flex; gap: 10px; align-items: flex-end; }
.hintrow .badge { width: 52px; height: 52px; }
.bubble { background: var(--night2); color: #fff; border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 17px; box-shadow: inset 0 0 0 1px var(--cyan); max-width: 60ch; }
.bubble b { color: var(--cyan); }
.bubble.good b { color: var(--mint); }
.bubble.sol b { color: var(--gold); }
.nextrow { display: flex; justify-content: flex-end; }
.newtype { border-radius: 16px; padding: 16px; background: rgba(56,225,255,.1); box-shadow: inset 0 0 0 1px var(--cyan); display: flex; flex-direction: column; gap: 12px; }
.newtype .board { pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--night2); color: #fff; box-shadow: inset 0 0 0 1px var(--gold), 0 10px 30px rgba(0,0,0,.4); border-radius: 14px; padding: 12px 18px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; background: rgba(5,9,25,.72); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--night2); border-radius: 20px; padding: 22px; box-shadow: inset 0 0 0 1px var(--cyan), 0 20px 60px rgba(0,0,0,.5); max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; color: #fff; }
.modal .bigicon { width: 140px; }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 26px; }
.fun { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.fun button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-weight: 700; cursor: pointer; }
.fun button:hover { background: var(--gold); color: var(--night); }
.summary { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.summary span { background: rgba(255,255,255,.08); border-radius: 10px; padding: 6px 12px; font-weight: 700; }

/* shop */
.shop { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 720px) { .shop { grid-template-columns: minmax(0, 1fr); } }
.cat h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 4px 0 8px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff; text-align: left; cursor: pointer; }
.item:hover { border-color: var(--cyan); }
.item .ic { width: 100%; height: 64px; border-radius: 10px; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: 34px; }
.item .ic svg { height: 56px; width: 80px; }
.item b { font-size: 15px; }
.price { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; font-size: 14px; }
.item.owned .price { color: var(--mint); }
.item.on { border-color: var(--mint); box-shadow: 0 0 14px rgba(61,220,151,.3); }
.item.special { border-color: rgba(255,207,61,.7); }
.item.locked { opacity: .45; cursor: default; }
.item.trying { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,207,61,.35); }
.tryon { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255,207,61,.08); border: 1px solid rgba(255,207,61,.5); }
.tryon .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- parent ---------- */
.ptop { background: var(--panel); border-bottom: 1px solid var(--line); }
.ptop .wrap { padding-block: 10px; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 15px; }
.tabs button.on { background: var(--ink); color: #fff; }
.tabs .cnt { display: inline-block; min-width: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; margin-left: 4px; padding: 0 5px; }
.pbtn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 700; }
.pbtn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.pbtn.danger { color: #a3122a; border-color: #f0c2cb; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 18px; }
.card h3 { font-size: 15px; }
.alert { border-left: 5px solid var(--ok); background: var(--okbg); padding: 10px 14px; border-radius: 6px; }
.alert.warn { border-color: #c27c00; background: var(--warnbg); }
.alert.info { border-color: #3a5bd9; background: #eef2ff; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: #fff; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 13px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.chart svg { width: 100%; height: auto; display: block; }
.tbl { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.meter { width: 90px; height: 8px; background: #eef1f7; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.meter i { display: block; height: 100%; background: #2f5bd0; }
.meter i.low { background: #c27c00; }
.pill { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #eef1f7; color: var(--muted); }
.pill.up { background: var(--okbg); color: var(--ok); }
.pill.down { background: var(--warnbg); color: var(--warn); }
.qcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.qcard .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.qcard .meta span { color: var(--muted); }
.qcard .board { padding: 12px; background: #f6f8ff; }
.qcard .cellbox svg, .qcard .opt svg { width: 48px; height: 48px; }
.qcard .matrix .cellbox svg { width: 52px; height: 52px; }
.qcard .opt { cursor: default; }
.qcard .opt.picked { box-shadow: 0 0 0 4px #e0a000; }
.qcard .bigq { font-size: 17px; }
.qcard .bal svg { width: 170px; }
.why { font-size: 14px; background: #fffbea; border-radius: 8px; padding: 8px 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
.bossrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fff; }
.bossrow.open { border-color: var(--ink); background: #fffbea; }
.starbtn { border: 2px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 12px; cursor: pointer; white-space: nowrap; font-weight: 700; }
.starbtn.on { background: var(--gold); border-color: var(--ink); }
.pform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pform input, .pform select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
.small { font-size: 13px; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warnbg); border-radius: 8px; padding: 8px 10px; }

@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pulse { 50% { transform: scale(1.14); opacity: .6; } }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .wave { animation: wave 1s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wave { 50% { transform: rotate(-6deg); } }
}

/* v1: opslagstatus */
#sync { position: fixed; right: 10px; bottom: 10px; z-index: 50; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(11,19,48,.85); color: #b8c3e6; border: 1px solid #2a3870; pointer-events: none; }
#sync.ok { opacity: .55; }
#sync.off { background: #fff4dc; color: #8a5800; border-color: #e7c98a; opacity: 1; }
body.parent #sync { background: #ffffff; color: #5b6078; border-color: #d5dcec; }
body.parent #sync.off { background: #fff4dc; color: #8a5800; }
.auth-note { max-width: 46ch; color: var(--soft); text-align: center; }
.linkbtn { background: none; border: 0; color: var(--cyan); text-decoration: underline; cursor: pointer; padding: 4px; }
.pform input[type=password], .pform input[type=email], .pform input[type=text], .pform select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; color: var(--ink); }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* Puzzelmaker: maakt nieuwe puzzels op een moeilijkheid van 1 t/m 20, in hetzelfde formaat als het lesprogramma.
   Elke puzzel is reproduceerbaar uit zijn id ("G:<soort>:<moeilijkheid>:<seed>"), dus er hoeft niets opgeslagen te worden. */
const GEN = (() => {
  const KLEUREN = ['rood', 'blauw', 'geel', 'groen', 'oranje', 'paars'];
  const VORMEN = ['rondje', 'vierkant', 'driehoek', 'ster', 'ruit', 'zeshoek'];
  const VORM_MV = { rondje: 'rondjes', vierkant: 'vierkanten', driehoek: 'driehoeken', ster: 'sterren', ruit: 'ruiten', zeshoek: 'zeshoeken', pijl: 'pijlen' };
  const RAND = [0, 1, 2, 5, 8, 7, 6, 3]; // vakjes langs de rand, met de klok mee
  const MV = { voetbal: 'voetballen', kokosnoot: 'kokosnoten', banaan: 'bananen', shuttle: 'shuttles' };
  const NAMEN = ['Sem', 'Noor', 'Ayu', 'Daan', 'Mila', 'Finn', 'Siti', 'Bram', 'Lina', 'Jayden'];
  const THEMAS = [
    { zin: 'Drie spelers hebben elk een racket in een andere kleur.', wat: ['rood', 'blauw', 'geel'], ja: (n, x) => `${n} heeft het ${x === 'rood' ? 'rode' : x === 'blauw' ? 'blauwe' : 'gele'} racket.`, nee: (n, x) => `${n} heeft niet het ${x === 'rood' ? 'rode' : x === 'blauw' ? 'blauwe' : 'gele'} racket.`, vraag: x => `Wie heeft het ${x === 'rood' ? 'rode' : x === 'blauw' ? 'blauwe' : 'gele'} racket?` },
    { zin: 'Drie kinderen doen elk een andere sport.', wat: ['voetbal', 'badminton', 'snowboarden'], ja: (n, x) => `${n} doet aan ${x}.`, nee: (n, x) => `${n} doet niet aan ${x}.`, vraag: x => `Wie doet aan ${x}?` },
    { zin: 'Drie vrienden kiezen elk een ander eten.', wat: ['pizza', 'wraps', 'nasi lemak'], ja: (n, x) => `${n} kiest ${x}.`, nee: (n, x) => `${n} kiest geen ${x}.`, vraag: x => `Wie kiest ${x}?` },
    { zin: 'Drie racers rijden elk in een andere auto.', wat: ['Ferrari', 'Porsche', 'McLaren'], ja: (n, x) => `${n} rijdt in de ${x}.`, nee: (n, x) => `${n} rijdt niet in de ${x}.`, vraag: x => `Wie rijdt in de ${x}?` },
    { zin: 'Drie fans luisteren elk naar een andere zanger.', wat: ['Queen', 'Elvis', 'Michael Jackson'], ja: (n, x) => `${n} luistert naar ${x}.`, nee: (n, x) => `${n} luistert niet naar ${x}.`, vraag: x => `Wie luistert naar ${x}?` },
    { zin: 'Drie spelers van een jeugdteam spelen elk op een andere plek.', wat: ['keeper', 'verdediger', 'spits'], ja: (n, x) => `${n} is ${x}.`, nee: (n, x) => `${n} is geen ${x}.`, vraag: x => `Wie is de ${x}?` },
  ];

  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const mk = r => ({ int: (lo, hi) => lo + Math.floor(r() * (hi - lo + 1)), pick: a => a[Math.floor(r() * a.length)], shuf: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }, r });
  const key = f => JSON.stringify(f);
  const F = (k, c, o = {}) => { const f = { k, c }; if (o.s && o.s !== 'm') f.s = o.s; if (o.n && o.n !== 1) f.n = o.n; if (o.r) f.r = ((o.r % 360) + 360) % 360; if (o.f === 'leeg') f.f = 'leeg'; if (o.p) f.p = o.p; return f; };
  const kl = (f, ch) => F(ch.k ?? f.k, ch.c ?? f.c, { s: ch.s ?? f.s, n: ch.n ?? f.n, r: ch.r ?? f.r, f: ch.f ?? f.f, p: ch.p ?? f.p });
  /* antwoord vooraan (ans = 0), daarna unieke afleiders */
  function opties(ans, kandidaten, n = 4) { const out = [ans], seen = new Set([key(ans)]); for (const c of kandidaten) { if (out.length >= n) break; const k = key(c); if (!seen.has(k)) { seen.add(k); out.push(c); } } return out.length >= 3 ? out : null; }

  /* ---- getallenreeksen ---- */
  function getallen(R, d) {
    let t, ans, why;
    const kind = d <= 6 ? R.pick(['plus', 'min']) : d <= 12 ? R.pick(['plus', 'min', 'keer', 'groei']) : d <= 15 ? R.pick(['twee', 'groei', 'wissel', 'keer']) : R.pick(['twee', 'wissel', 'keerplus', 'som', 'kwadraat', 'groei2']);
    if (kind === 'plus') { const a = R.int(1, 12), k = R.int(2, d <= 3 ? 3 : 9); t = [0, 1, 2, 3, 4].map(i => a + i * k); ans = a + 5 * k; why = `${ans}: er komt steeds ${k} bij.`; }
    else if (kind === 'min') { const k = R.int(2, d <= 3 ? 3 : 8), a = 5 * k + R.int(5, 30); t = [0, 1, 2, 3, 4].map(i => a - i * k); ans = a - 5 * k; why = `${ans}: er gaat steeds ${k} af.`; }
    else if (kind === 'keer') { const a = R.int(1, 4), m = d < 15 ? 2 : R.pick([2, 3]); t = [0, 1, 2, 3].map(i => a * m ** i); ans = a * m ** 4; why = `${ans}: elk getal is ${m === 2 ? 'het dubbele van' : 'drie keer'} het vorige.`; }
    else if (kind === 'groei') { const a = R.int(1, 10), s = R.int(1, 2); t = [a]; for (let i = 0; i < 4; i++) t.push(t[i] + s + i); ans = t[4] + s + 4; why = `${ans}: de stap wordt steeds één groter (+${s}, +${s + 1}, +${s + 2}...).`; }
    else if (kind === 'wissel') { const a = R.int(1, 10), p = R.int(2, 5), q = R.int(1, 4); t = [a]; for (let i = 0; i < 5; i++) t.push(t[i] + (i % 2 ? -q : p)); ans = t[5] - q; why = `${ans}: het gaat om en om +${p} en −${q}.`; }
    else if (kind === 'keerplus') { const a = R.int(1, 4), p = R.int(1, 3); t = [a]; for (let i = 0; i < 4; i++) t.push(t[i] * 2 + p); ans = t[4] * 2 + p; why = `${ans}: steeds keer 2 en dan +${p}.`; }
    else if (kind === 'som') { const a = R.int(1, 4), b = R.int(a, a + 4); t = [a, b]; for (let i = 0; i < 4; i++) t.push(t[i] + t[i + 1]); ans = t[4] + t[5]; why = `${ans}: elk getal is de twee getallen ervoor bij elkaar opgeteld (${t[4]} + ${t[5]}).`; }
    else if (kind === 'kwadraat') { const a = R.int(1, 4); t = [0, 1, 2, 3, 4].map(i => (a + i) * (a + i)); ans = (a + 5) * (a + 5); why = `${ans}: het zijn ${a}×${a}, ${a + 1}×${a + 1}, ${a + 2}×${a + 2}... dus nu ${a + 5}×${a + 5}.`; }
    else if (kind === 'groei2') { const a = R.int(1, 9), s = R.int(1, 3); t = [a]; for (let i = 0; i < 4; i++) t.push(t[i] + s + 2 * i); ans = t[4] + s + 8; why = `${ans}: de stap wordt steeds 2 groter (+${s}, +${s + 2}, +${s + 4}...).`; }
    else { const a = R.int(1, 5), b = R.int(10, 30), k = R.int(1, 3), m = R.int(2, 5) * (R.r() < .5 ? 1 : -1); t = []; for (let i = 0; i < 6; i++) t.push(i % 2 ? b + m * ((i - 1) / 2) : a + k * (i / 2)); ans = a + k * 3; why = `${ans}: er lopen twee reeksen door elkaar. Op deze plek komt de reeks ${a}, ${a + k}, ${a + 2 * k}...`; }
    const cand = R.shuf([ans + 1, ans - 1, ans + 2, ans - 2, t[t.length - 1], ans + 10]).filter(x => x >= 0 && x !== ans);
    const o = opties(ans, cand); if (!o) return null;
    return { type: 'text', q: 'Welk getal komt er op het vraagteken?   ' + t.join(' · ') + ' · ?', opts: o, ans: 0, why };
  }

  /* ---- puzzelvakjes ---- */
  function matrix(R, d) {
    const cs = R.shuf(KLEUREN).slice(0, 3), vs = R.shuf(VORMEN).slice(0, 3);
    if (d <= 8) {
      const A = F(vs[0], cs[0]), B = F(vs[1], cs[0]), C = F(vs[0], cs[1]), ans = F(vs[1], cs[1]);
      const o = opties(ans, R.shuf([F(vs[1], cs[0]), F(vs[0], cs[1]), F(vs[1], cs[2]), F(vs[2], cs[1])]));
      return o && { type: 'matrix', grid: [[A, B], [C, null]], opts: o, ans: 0, why: `${cap(een(cs[1], vs[1]))}: naar rechts verandert de vorm, naar beneden de kleur.` };
    }
    if (d <= 14) {
      const tel = d >= 12 && R.r() < .5;
      const cell = (r, c) => tel ? F(vs[0], cs[r], { n: c + 1 }) : F(vs[c], cs[r]);
      const grid = [0, 1, 2].map(r => [0, 1, 2].map(c => cell(r, c))); const ans = grid[2][2]; grid[2][2] = null;
      const cand = tel ? [F(vs[0], cs[2], { n: 2 }), F(vs[0], cs[1], { n: 3 }), F(vs[1], cs[2], { n: 3 }), F(vs[0], cs[0], { n: 3 })] : [F(vs[1], cs[2]), F(vs[2], cs[1]), F(vs[0], cs[2]), F(vs[2], cs[0])];
      const o = opties(ans, R.shuf(cand));
      return o && { type: 'matrix', grid, opts: o, ans: 0, why: tel ? `Drie ${kleurWoord(cs[2])} ${VORM_MV[vs[0]]}: elke rij heeft één kleur en in elke kolom komt er één bij.` : `${cap(een(cs[2], vs[2]))}: elke rij heeft één kleur, elke kolom één vorm.` };
    }
    if (d >= 17 && R.r() < .5) {
      // drie regels: vorm per rij, kleur per kolom, aantal (r+c)%3+1
      const cell = (r, c) => F(vs[r], cs[c], { n: (r + c) % 3 + 1 });
      const grid = [0, 1, 2].map(r => [0, 1, 2].map(c => cell(r, c))); const ans = grid[2][2]; grid[2][2] = null;
      const o = opties(ans, R.shuf([F(vs[2], cs[2], { n: 1 }), F(vs[2], cs[2], { n: 3 }), F(vs[2], cs[1], { n: 2 }), F(vs[1], cs[2], { n: 2 }), F(vs[2], cs[0], { n: 2 })]));
      return o && { type: 'matrix', grid, opts: o, ans: 0, why: `Twee ${kleurWoord(cs[2])} ${VORM_MV[vs[2]]}: elke rij heeft één vorm, elke kolom één kleur, en het aantal (1, 2, 3) komt in elke rij en kolom één keer voor.` };
    }
    // latijns vierkant: vorm (r+c), kleur (r+2c) mod 3
    const grid = [0, 1, 2].map(r => [0, 1, 2].map(c => F(vs[(r + c) % 3], cs[(r + 2 * c) % 3]))); const ans = grid[2][2]; grid[2][2] = null;
    const cand = R.shuf([F(vs[(2 + 1) % 3], cs[(2 + 2 * 2) % 3]), F(vs[(2 + 2) % 3], cs[(2 + 1 * 2) % 3]), F(vs[(2 + 0) % 3], cs[(2 + 2 * 2) % 3]), F(vs[(2 + 2) % 3], cs[(2 + 0) % 3])]);
    const o = opties(ans, cand);
    return o && { type: 'matrix', grid, opts: o, ans: 0, why: `${cap(een(ans.c, ans.k))}: in elke rij en elke kolom komt elke vorm en elke kleur precies één keer voor.` };
  }

  /* ---- reeksen met figuren ---- */
  function reeks(R, d) {
    if (d <= 6) {
      const pat = d <= 3 ? [0, 1] : R.pick([[0, 1, 2], [0, 0, 1]]);
      const items = pat.map(() => null), vs = R.shuf(VORMEN), cs = R.shuf(KLEUREN);
      const fig = i => F(vs[pat[i % pat.length]], cs[pat[i % pat.length]]);
      const seq = [0, 1, 2, 3, 4, 5].map(fig); const ans = fig(6); void items;
      const o = opties(ans, R.shuf([fig(5), fig(7), F(vs[3], cs[3]), F(ans.k, cs[4])]));
      return o && { type: 'series', seq: seq.concat([null]), opts: o, ans: 0, why: `Het patroon herhaalt zich steeds. Daarom komt er nu ${een(ans.c, ans.k)}.` };
    }
    if (d <= 13 && R.r() < .5) {
      const c = R.pick(KLEUREN), st = R.pick([90, 90, 45, 180]), r0 = R.pick([0, 90, 180, 270]);
      const seq = [0, 1, 2, 3].map(i => F('pijl', c, { r: r0 + i * st })); const ans = F('pijl', c, { r: r0 + 4 * st });
      const o = opties(ans, R.shuf([F('pijl', c, { r: r0 + 3 * st }), F('pijl', c, { r: r0 + 5 * st }), F('pijl', c, { r: r0 + 4 * st + 180 }), F('pijl', c, { r: r0 + 4 * st + 90 })]));
      return o && { type: 'series', seq: seq.concat([null]), opts: o, ans: 0, why: `De pijl draait steeds ${st === 90 ? 'een kwartslag' : st === 180 ? 'een halve slag' : 'een achtste slag'} met de klok mee.` };
    }
    if (d <= 13) {
      // vakje loopt langs de rand
      const stap = d >= 11 ? R.pick([1, 2]) : 1, s0 = R.int(0, 7), c = R.pick(KLEUREN), tegen = d >= 10 && R.r() < .4;
      const pos = i => RAND[((s0 + (tegen ? -1 : 1) * i * stap) % 8 + 8) % 8];
      const seq = [0, 1, 2, 3].map(i => F('raster', c, { p: [pos(i)] })), ans = F('raster', c, { p: [pos(4)] });
      const o = opties(ans, R.shuf([F('raster', c, { p: [pos(3)] }), F('raster', c, { p: [pos(5)] }), F('raster', c, { p: [4] }), F('raster', c, { p: [RAND[(RAND.indexOf(pos(4)) + 4) % 8]] })]));
      return o && { type: 'series', seq: seq.concat([null]), opts: o, ans: 0, why: `Het vakje loopt langs de rand, ${tegen ? 'tegen' : 'met'} de klok ${tegen ? 'in' : 'mee'}, steeds ${stap === 1 ? 'één stap' : 'twee stappen'}.` };
    }
    // twee regels: draaien + kleur wisselt, of aantal + vol/leeg
    if (R.r() < .5) {
      const cs = R.shuf(KLEUREN).slice(0, d >= 17 ? 3 : 2), r0 = R.pick([0, 90]);
      const fig = i => F('pijl', cs[i % cs.length], { r: r0 + i * 90 });
      const seq = [0, 1, 2, 3, 4].map(fig), ans = fig(5);
      const o = opties(ans, R.shuf([kl(ans, { c: cs[(5 + 1) % cs.length] }), kl(ans, { r: ans.r ? ans.r + 90 : 90 }), kl(ans, { r: (ans.r || 0) + 180 }), fig(4)]));
      return o && { type: 'series', seq: seq.concat([null]), opts: o, ans: 0, why: `Twee regels: de pijl draait steeds een kwartslag en de kleur gaat ${cs.join(', ')}, opnieuw.` };
    }
    const v = R.pick(VORMEN.slice(0, 4)), c = R.pick(KLEUREN);
    const fig = i => F(v, c, { n: i + 1, f: i % 2 ? 'leeg' : 'vol' });
    const seq = [0, 1, 2, 3, 4].map(fig), ans = fig(5);
    const o = opties(ans, R.shuf([kl(ans, { f: 'vol' }), F(v, c, { n: 5, f: 'leeg' }), F(v, c, { n: 4, f: 'leeg' }), kl(ans, { k: VORMEN[(VORMEN.indexOf(v) + 1) % 4] })]));
    return o && { type: 'series', seq: seq.concat([null]), opts: o, ans: 0, why: `Er komt steeds één ${v} bij, en vol en leeg wisselen af. Dus zes lege ${VORM_MV[v]}.` };
  }

  /* ---- wat hoort er niet bij ---- */
  function anders(R, d) {
    const n = d >= 12 ? 5 : 4, pos = R.int(0, n - 1), v = R.pick(VORMEN), c = R.pick(KLEUREN);
    let cells, why;
    if (d <= 6) {
      const omKleur = R.r() < .5, ander = omKleur ? F(v, R.pick(KLEUREN.filter(x => x !== c))) : F(R.pick(VORMEN.filter(x => x !== v)), c);
      cells = Array.from({ length: n }, (_, i) => i === pos ? ander : F(v, c));
      why = omKleur ? `Plaatje ${'ABCDE'[pos]} heeft een andere kleur.` : `Plaatje ${'ABCDE'[pos]} heeft een andere vorm.`;
    } else if (d <= 11) {
      const mode = R.pick(['n', 's', 'f']);
      const basis = F(v, c, { n: mode === 'n' ? 2 : 1, s: 'm' });
      const ander = mode === 'n' ? kl(basis, { n: 3 }) : mode === 's' ? kl(basis, { s: 'l' }) : kl(basis, { f: 'leeg' });
      cells = Array.from({ length: n }, (_, i) => i === pos ? ander : basis);
      why = `Plaatje ${'ABCDE'[pos]} is anders: ${mode === 'n' ? 'het heeft een ander aantal' : mode === 's' ? 'het is groter' : 'het is leeg'}.`;
    } else if (d >= 16 && R.r() < .5) {
      // vorm en kleur horen bij elkaar; één plaatje breekt die koppeling
      const [v1, v2] = R.shuf(VORMEN).slice(0, 2), [c1, c2] = R.shuf(KLEUREN).slice(0, 2);
      cells = Array.from({ length: n }, (_, i) => i % 2 ? F(v2, c2, { n: R.int(1, 3) }) : F(v1, c1, { n: R.int(1, 3) }));
      cells[pos] = pos % 2 ? F(v2, c1, { n: cells[pos].n || 1 }) : F(v1, c2, { n: cells[pos].n || 1 });
      why = `Alle ${VORM_MV[v1]} zijn ${c1} en alle ${VORM_MV[v2]} zijn ${c2}. Plaatje ${'ABCDE'[pos]} breekt die regel. Het aantal doet er niet toe.`;
    } else {
      // de anderen verschillen in kleur (afleiding), de regel zit in het aantal of de vorm
      const cs = R.shuf(KLEUREN), mode = R.pick(['n', 'k']);
      cells = Array.from({ length: n }, (_, i) => F(i === pos && mode === 'k' ? R.pick(VORMEN.filter(x => x !== v)) : v, cs[i], { n: i === pos && mode === 'n' ? 3 : 2 }));
      why = `De kleur doet er niet toe. Plaatje ${'ABCDE'[pos]} is anders: ${mode === 'n' ? 'het heeft drie vormen, de rest twee' : 'het heeft een andere vorm'}.`;
    }
    return { type: 'odd', cells, ans: pos, why };
  }

  /* ---- analogieën met figuren ---- */
  const TRANS = {
    groot: { do: f => kl(f, { s: 'l' }), uit: 'wordt groot', ok: f => f.s !== 'l' },
    leeg: { do: f => kl(f, { f: 'leeg' }), uit: 'wordt leeg', ok: f => f.f !== 'leeg' },
    draai: { do: f => kl(f, { r: (f.r || 0) + 90 }), uit: 'draait een kwartslag', ok: f => f.k === 'pijl' || f.k === 'driehoek' },
    twee: { do: f => kl(f, { n: 2 }), uit: 'wordt twee keer zo veel', ok: f => !f.n || f.n === 1 },
  };
  function analogie(R, d) {
    const keys = Object.keys(TRANS);
    const aantal = d <= 9 ? 1 : 2;
    for (let tries = 0; tries < 20; tries++) {
      const ts = R.shuf(keys).slice(0, aantal);
      const vormA = R.pick(['pijl', 'driehoek', ...VORMEN]), vormC = R.pick(['pijl', 'driehoek', ...VORMEN].filter(x => x !== vormA));
      const A = F(vormA, R.pick(KLEUREN), { s: 's' }), C = F(vormC, R.pick(KLEUREN), { s: 's' });
      if (!ts.every(t => TRANS[t].ok(A) && TRANS[t].ok(C))) continue;
      const app = (f, list) => list.reduce((x, t) => TRANS[t].do(x), f);
      const B = app(A, ts), ans = app(C, ts);
      const cand = [C, app(C, ts.slice(0, 1)), app(C, ts.slice(1)), app(C, keys.filter(k => !ts.includes(k) && TRANS[k].ok(C)).slice(0, 1)), kl(ans, { k: vormA })];
      const o = opties(ans, R.shuf(cand)); if (!o) continue;
      return { type: 'analogy', abc: [A, B, C], opts: o, ans: 0, why: `Het eerste plaatje ${ts.map(t => TRANS[t].uit).join(' en ')}. Doe hetzelfde met het derde plaatje.` };
    }
    return null;
  }

  /* ---- weegschalen ---- */
  function weegschaal(R, d) {
    const [X, Y, Z] = R.shuf(Object.keys(MV)).slice(0, 3);
    if (d <= 8) {
      const k = R.int(2, 3), m = R.int(2, d <= 4 ? 2 : 3);
      if (m * k > 9) return null;
      return { type: 'balance', facts: [[[[X, 1]], [[Y, k]]]], ask: [[[X, m]], '?'], askline: `Hoeveel ${MV[Y]}?`, opts: opties(m * k, R.shuf([m + k, m * k - 1, m * k + 1, k, m * k + k]).filter(v => v > 0 && v !== m * k)), ans: 0, why: `${m * k}: 1 ${X} weegt evenveel als ${k} ${MV[Y]}, dus ${m} keer zo veel is ${m * k}.` };
    }
    if (d <= 14) {
      const a = R.int(2, 3), b = R.int(2, 3);
      return { type: 'balance', facts: [[[[X, 1]], [[Y, a]]], [[[Y, 1]], [[Z, b]]]], ask: [[[X, 1]], '?'], askline: `Hoeveel ${MV[Z]}?`, opts: opties(a * b, R.shuf([a + b, a * b - 1, a * b + 1, b, a * b + b]).filter(v => v > 0 && v !== a * b)), ans: 0, why: `${a * b}: 1 ${X} = ${a} ${MV[Y]}, en elke ${Y} = ${b} ${MV[Z]}. Dus ${a} × ${b} = ${a * b}.` };
    }
    if (d >= 17 && R.r() < .6) {
      if (R.r() < .5) {
        const a = R.int(2, 3), b = R.int(2, 3), m = 2;
        return { type: 'balance', facts: [[[[X, 1]], [[Y, a]]], [[[Y, 1]], [[Z, b]]]], ask: [[[X, m]], '?'], askline: `Hoeveel ${MV[Z]}?`, opts: opties(m * a * b, R.shuf([a * b, m * a + b, m * a * b - 2, m * a * b + 2, a * b + m]).filter(v => v > 0 && v !== m * a * b)), ans: 0, why: `${m * a * b}: 1 ${X} = ${a} ${MV[Y]} = ${a} × ${b} = ${a * b} ${MV[Z]}. Twee keer zoveel is ${m * a * b}.` };
      }
      const k = R.int(2, 3), n = 2 * k;
      return { type: 'balance', facts: [[[[X, 2]], [[Y, 1]]], [[[Y, 1]], [[Z, n]]]], ask: [[[X, 1]], '?'], askline: `Hoeveel ${MV[Z]}?`, opts: opties(k, R.shuf([n, 2 * n, k + 1, k - 1, n - 1]).filter(v => v > 0 && v !== k)), ans: 0, why: `${k}: 2 ${MV[X]} wegen samen evenveel als ${n} ${MV[Z]}. Eén ${X} is dus de helft: ${k}.` };
    }
    const a = R.int(2, 4), y = R.int(1, 4), n = a + y;
    if (n > 6) return null;
    return { type: 'balance', facts: [[[[X, 1], [Y, 1]], [[Z, n]]], [[[X, 1]], [[Z, a]]]], ask: [[[Y, 1]], '?'], askline: `Hoeveel ${MV[Z]}?`, opts: opties(y, R.shuf([n, a, y + 1, y + 2, n + a]).filter(v => v > 0 && v !== y)), ans: 0, why: `${y}: samen wegen ze ${n}. De ${X} weegt al ${a}, dus voor de ${Y} blijft ${n} − ${a} = ${y} over.` };
  }

  /* ---- logica-rooster ---- */
  const PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  function rooster(R, d) {
    const th = R.pick(THEMAS), namen = R.shuf(NAMEN).slice(0, 3), sol = R.pick(PERMS);
    // kandidaat-aanwijzingen
    const clues = [];
    for (let p = 0; p < 3; p++) for (let w = 0; w < 3; w++) {
      if (sol[p] === w) clues.push({ t: 'ja', p, w }); else clues.push({ t: 'nee', p, w });
    }
    const fits = (perm, cl) => cl.every(c => c.t === 'ja' ? perm[c.p] === c.w : perm[c.p] !== c.w);
    const maxJa = d >= 15 ? 0 : 1;
    let chosen = [];
    for (const c of R.shuf(clues)) {
      if (c.t === 'ja' && chosen.filter(x => x.t === 'ja').length >= maxJa) continue;
      if (fits(sol, chosen.concat([c])) && PERMS.filter(pm => fits(pm, chosen)).length > PERMS.filter(pm => fits(pm, chosen.concat([c]))).length) chosen.push(c);
      if (PERMS.filter(pm => fits(pm, chosen)).length === 1) break;
    }
    if (PERMS.filter(pm => fits(pm, chosen)).length !== 1) return null;
    const ww = R.int(0, 2), wie = sol.indexOf(ww);
    const zin = c => c.t === 'ja' ? th.ja(namen[c.p], th.wat[c.w]) : th.nee(namen[c.p], th.wat[c.w]);
    return { type: 'grid', q: th.zin, rows: namen, cols: th.wat, clues: chosen.map(zin), subq: th.vraag(th.wat[ww]), opts: namen.slice(), ans: wie, why: `${namen[wie]}. Oplossing: ${namen.map((n, i) => `${n}: ${th.wat[sol[i]]}`).join(', ')}.` };
  }

  const kleurWoord = c => ({ rood: 'rode', blauw: 'blauwe', geel: 'gele', groen: 'groene', oranje: 'oranje', paars: 'paarse', zwart: 'zwarte' }[c] || c);
  const HET = ['rondje', 'vierkant'];
  const een = (c, k) => 'een ' + (HET.includes(k) && c !== 'oranje' ? c : kleurWoord(c)) + ' ' + k;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  const MAKERS = { text: getallen, matrix, series: reeks, odd: anders, analogy: analogie, balance: weegschaal, grid: rooster };
  function make(type, d, seed) {
    for (let k = 0; k < 12; k++) {
      const R = mk(rng(seed * 31 + k));
      const it = MAKERS[type](R, d);
      if (it && (it.type === 'odd' || (it.opts && it.opts.length >= 3))) { it.id = `G:${type}:${d}:${seed}`; it.lvl = d; it.gen = true; return it; }

})();

/* Wachtwoord van het kind: alleen een hash bewaren, nooit het wachtwoord zelf */
async function hashPw(pw) {
  const s = 'puzzelheld:' + pw;
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return 'h1:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return 'h0:' + h.toString(16);
}

const NODES = [[90, 340], [250, 320], [400, 335], [560, 305], [705, 280]];

/* ===================== GAME LOGIC ===================== */
function ensureDay(t = Date.now()) { const k = dayKey(t); if (!S.days[k]) S.days[k] = { ms: 0, nudges: 0, bonus: false, pause: false }; return S.days[k]; }
function addXP(n, why) { const before = rankOf(S.kid.xp); S.kid.xp += n; const after = rankOf(S.kid.xp); if (after > before) pendingRankUp = after; return n; }
let pendingRankUp = null;

function pickItems(n, boss) {
  const d = S.prog.d;
  const chosen = [];
  // terugkomers: eerder niet zelf opgelost
  S.retry.filter(id => getItem(id)).slice(0, boss ? 1 : 2).forEach(id => chosen.push(id));
  // eerst nog niet gespeelde puzzels uit het lesprogramma rond dit niveau, daarna de puzzelmaker
  const byType = {}, taken = new Set(chosen.map(id => stemSig(getItem(id))));
  shuffle(DATA.items.filter(it => it.lvl >= d - 1 && it.lvl <= d + 1 && !S.seen[it.id] && !chosen.includes(it.id) && !sigSeen(stemSig(it)))).forEach(it => { (byType[it.type] = byType[it.type] || []).push(it.id); });
  const types = shuffle(Object.keys(TYPE_NAMES));
  let guard = 0;
  while (chosen.length < n && guard++ < 50) {
    for (const t of types) {
      if (chosen.length >= n) break;
      let id = (byType[t] || []).shift();
      if (id && taken.has(stemSig(getItem(id)))) id = null;
      if (!id && typeof GEN !== 'undefined') id = genId(t, d, taken);
      if (id && !chosen.includes(id)) { chosen.push(id); taken.add(stemSig(getItem(id))); }
    }
  }
  return shuffle(chosen).map(id => ({ id, order: optionOrder(getItem(id)) }));
}
function optionOrder(it) {
  if (it.type === 'odd') return it.cells.map((_, i) => i);
  const idx = it.opts.map((_, i) => i);
  if (it.opts.every(o => typeof o === 'number')) return idx.sort((a, b) => it.opts[a] - it.opts[b]);
  return shuffle(idx);
}
function startStop(stopIdx) {
  const boss = stopIdx === 4;
  S.run = { world: S.prog.world, stop: stopIdx, boss, items: pickItems(boss ? PUZZLES_PER_BOSS : PUZZLES_PER_STOP, boss), idx: 0, res: [], started: Date.now(), cur: null };
  save();
}
function curItem() { const r = S.run; return r && r.items[r.idx] ? getItem(r.items[r.idx].id) : null; }

function hintsFor(it) {
  switch (it.type) {
    case 'odd': return ['KIJK: vergelijk de plaatjes. Let op kleur, vorm, grootte en aantal.', 'ZEG: noem bij elk plaatje hardop de kleur en de vorm. Bij welk plaatje klinkt het anders?'];
    case 'series': return ['KIJK: wat verandert er van het ene plaatje naar het volgende?', 'REGEL: maak er een zin van, zoals "hij draait steeds een kwartslag". Wat komt er dan na het laatste plaatje?'];
    case 'matrix': return ['KIJK naar de rijen (→). Wat is in een rij hetzelfde, en wat verandert?', 'Kijk nu ook naar de kolommen (↓). Het antwoord moet bij de rij én bij de kolom passen.'];
    case 'analogy': return ['ZEG: hoe verandert het eerste plaatje in het tweede?', 'REGEL: doe precies hetzelfde met het derde plaatje.'];
    case 'balance': return ['KIJK: begin bij de weegschaal met de minste dingen. Wat weet je daar zeker?', 'Vervang stap voor stap: zet in de vraag in plaats van een voorwerp wat het weegt.'];
    case 'grid': return ['Begin bij de aanwijzing die iets zeker zegt. Zet daar een ✓.', 'Zet een ✗ bij alles wat niet kan. Wat blijft er over?'];
    default: return ['KIJK goed: wat is de verbinding of wat verandert er steeds?', 'ZEG je regel hardop en CHECK of hij bij alles klopt.'];
  }
}
function questionText(it) {
  if (it.q) return it.q;
  return { odd: 'Wat hoort er niet bij?', series: 'Wat komt er op het vraagteken?', matrix: 'Wat hoort in het lege vakje?', analogy: 'Wat hoort op het vraagteken?', balance: 'Alle weegschalen zijn in balans.' }[it.type] || '';
}

/* answer handling: choice = original option index */
function answer(choice) {
  const r = S.run, it = curItem(); if (!it || !r.cur || r.cur.done) return;
  const c = r.cur;
  c.picks.push(choice);
  if (choice === it.ans) { finishItem(true); return; }
  c.tries++;
  if (c.tries === 2) {
    const wrong = optionsIdx(it).filter(i => i !== it.ans && !c.picks.includes(i) && !c.removed.includes(i));
    if (wrong.length > 1) c.removed.push(wrong[Math.floor(Math.random() * wrong.length)]);
  }
  const remaining = optionsIdx(it).filter(i => !c.picks.includes(i) && !c.removed.includes(i));
  if (c.tries >= 3 || remaining.length <= 1) { finishItem(false); return; }
  save(); renderPlay();
}
function optionsIdx(it) { return it.type === 'odd' ? it.cells.map((_, i) => i) : it.opts.map((_, i) => i); }
function finishItem(solved) {
  const r = S.run, it = curItem(), c = r.cur, now = Date.now();
  c.done = true; c.solved = solved;
  const ms = Math.min(now - c.t0, 5 * 60000);
  const day = ensureDay(now); day.ms += ms;
  let coins = solved ? [3, 2, 1][c.tries] || 1 : 0;
  if (solved && it.bonus) coins += 5;
  c.coins = coins; S.kid.coins += coins;
  let xp = 10;
  if (!day.bonus) { day.bonus = true; xp += 20; c.dayBonus = true; const st = streak(); if (st > 0 && st % 5 === 0) { xp += 50; c.streak = st; } }
  addXP(xp); c.xp = xp;
  S.seen[it.id] = { n: (S.seen[it.id] ? S.seen[it.id].n : 0) + 1, at: now };
  (S.sigs = S.sigs || {})[stemSig(it)] = now;
  if (!solved || c.tries > 0) { if (!S.retry.includes(it.id)) S.retry.push(it.id); }
  else S.retry = S.retry.filter(x => x !== it.id);
  const att = { k: it.id, type: it.type, lvl: it.lvl, at: now, w: r.world, s: r.stop, season: S.prog.season, boss: r.boss, picks: c.picks.slice(), order: r.items[r.idx].order, first: solved && c.tries === 0, hints: Math.min(c.tries, 2), solved, ms, removed: c.removed.slice() };
  S.attempts.push(att); c.att = S.attempts.length - 1;
  r.res.push({ first: att.first, solved, hints: att.hints, ai: c.att });
  if (!day.pause && day.ms > PAUSE_MS) { day.pause = true; setTimeout(() => toast('Je bent al een halfuur bezig. Even pauze? Je mag ook gewoon doorgaan.'), 600); }
  save(); renderPlay();
}
function streak() { let n = 0; for (let i = 0; i < 365; i++) { const k = dayKey(Date.now() - i * 864e5); if (S.days[k] && S.days[k].bonus) n++; else break; } return n; }
function nextItem() { const r = S.run; r.idx++; r.cur = null; save(); if (r.idx >= r.items.length) finishStop(); else renderPlay(); }
function finishStop() {
  const r = S.run, n = r.res.length, first = r.res.filter(x => x.first).length, pct = n ? Math.round(first / n * 100) : 0;
  let bonus = 0;
  if (n && r.res.every(x => x.first)) { bonus = 10; S.kid.coins += bonus; }
  const xp = r.boss ? 150 : 50; addXP(xp);
  const rec = { w: r.world, s: r.stop, boss: r.boss, at: Date.now(), pct, d: S.prog.d, n, first, fun: null, season: S.prog.season };
  S.stops.push(rec);
  // adaptief niveau
  const p = S.prog; p.recent.push(pct);
  if (pct >= 95 && p.d < 20) { const to = Math.min(20, p.d + 2); S.events.push({ at: Date.now(), type: 'up', from: p.d, to, pcts: [pct], fast: true }); p.d = to; p.recent = []; }
  else if (p.recent.length >= 2 && p.recent.slice(-2).every(x => x > 85) && p.d < 20) { S.events.push({ at: Date.now(), type: 'up', from: p.d, to: p.d + 1, pcts: p.recent.slice(-2) }); p.d++; p.recent = []; }
  else if (pct < 60 && p.d > 1) { S.events.push({ at: Date.now(), type: 'down', from: p.d, to: p.d - 1, pcts: [pct] }); p.d--; p.recent = []; }
  if (r.boss) {
    S.bosses.push({ w: r.world, season: p.season, at: Date.now(), atts: r.res.map(x => x.ai), stars: {}, reviewed: false });
    p.world++; p.stop = 0; if (p.world % WORLDS.length === 0) p.season++;
  } else p.stop = r.stop + 1;
  S.lastStop = { rec: S.stops.length - 1, xp, bonus, coins: r.res.reduce((a, x) => a + (S.attempts[x.ai].solved ? 0 : 0), 0) };
  S.run = null; save();
  showStopDone(rec, xp, bonus, r);
}

    </form></div></div>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { authMode = b.dataset.m; renderAuth(app); });
  const say = (t, ok) => { const el = $('#err'); el.textContent = t; el.className = ok ? 'err okmsg' : 'err'; };
  const here = location.origin + location.pathname;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const email = $('#aem').value.trim(); if (!email) return say('Vul je e-mailadres in.');
    $('#ago').disabled = true; say('');
    try {
      if (fg) {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) throw error; say('Gelukt. Kijk in je mail (ook bij spam) en klik op de link.', true); return;
      }
      const pw = $('#apw').value;
      if (su) {
        if (pw.length < 8) { $('#ago').disabled = false; return say('Kies een wachtwoord van minstens 8 tekens.'); }
        if (pw !== $('#apw2').value) { $('#ago').disabled = false; return say('De wachtwoorden zijn niet hetzelfde.'); }
        const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: here } });
        if (error) throw error;
        if (!data.session) { say('Bijna klaar! Kijk in je mail (ook bij spam) en klik op de bevestigingslink. Daarna kun je hier inloggen.', true); authMode = 'login'; return; }
        USER = data.session.user; return startUser();
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      USER = data.user; startUser();
    } catch (err) {
      const m = String(err && err.message || '');
      say(/invalid login/i.test(m) ? 'E-mailadres of wachtwoord klopt niet.' : /not confirmed/i.test(m) ? 'Je e-mailadres is nog niet bevestigd. Klik eerst op de link in je mail.' : /registered/i.test(m) ? 'Dit e-mailadres heeft al een account. Log in.' : /fetch|network/i.test(m) ? 'Geen verbinding met internet.' : 'Dat lukte niet: ' + m);
    } finally { const b = $('#ago'); if (b) b.disabled = false; }
  };
}

/* ---- puzzle rendering (shared by kid play and parent review) ---- */
function puzzleBody(it, order, mark) {
  // mark: {gone:[], right:idx|null, picked:[] , interactive:bool}
  const interactive = mark.interactive;
  const optBtn = (i, inner, txt) => {
    const cls = ['opt']; if (txt) cls.push('txt');
    const gone = mark.gone.includes(i), right = mark.right === i, picked = mark.picked && mark.picked.includes(i);
    if (gone) cls.push('gone'); if (right) cls.push('right'); if (picked) cls.push('picked');
    const letter = 'ABCDEFG'[order.indexOf(i)];
    return `<button class="${cls.join(' ')}" type="button" data-opt="${i}" ${!interactive || gone || mark.locked ? 'disabled' : ''} aria-label="Antwoord ${letter}">${inner}${txt ? '' : `<span class="l">${letter}</span>`}</button>`;
  };
  const optsHtml = () => `<div class="opts">${order.map(i => { const o = it.opts[i]; return typeof o === 'object' ? optBtn(i, fig(o)) : optBtn(i, esc(o), true); }).join('')}</div>`;
  const cell = (f, q) => `<div class="cellbox ${q ? 'q' : ''}">${fig(f)}</div>`;
  let b = '';
  switch (it.type) {
    case 'odd': b = `<div class="opts">${order.map(i => optBtn(i, fig(it.cells[i]))).join('')}</div>`; break;
    case 'series': b = `<div class="qrow">${it.seq.map(f => cell(f, !f)).join('')}</div>${optsHtml()}`; break;
    case 'matrix': b = `<div class="matrix" style="grid-template-columns:repeat(${it.grid[0].length},auto)">${it.grid.flat().map(f => cell(f, !f)).join('')}</div>${optsHtml()}`; break;
    case 'analogy': { const [a, bb, c] = it.abc; b = `<div class="qrow">${cell(a)}<span class="op">hoort bij</span>${cell(bb)}<span class="op">zoals</span>${cell(c)}<span class="op">hoort bij</span>${cell(null, true)}</div>${optsHtml()}`; break; }
    case 'balance': b = `<div class="bal">${it.facts.map(([l, r]) => `<div class="one">${balance(l, r)}</div>`).join('')}<div class="one ask">${balance(it.ask[0], it.ask[1])}</div></div><div class="bigq">${esc(it.askline)}</div>${optsHtml()}`; break;
    case 'grid': {
      const marks = (interactive && S.run && S.run.cur && S.run.cur.grid) || {};
      b = `<div class="lg"><ol>${it.clues.map(c => `<li>${esc(c)}</li>`).join('')}</ol><table><tr><th></th>${it.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${it.rows.map((r, ri) => `<tr><th>${esc(r)}</th>${it.cols.map((_, ci) => { const v = marks[ri + '-' + ci] || ''; return `<td>${interactive ? `<button type="button" data-cell="${ri}-${ci}" class="${v === '✗' ? 'x' : v === '✓' ? 'v' : ''}" aria-label="${esc(r)}, ${esc(it.cols[ci])}">${v}</button>` : ''}</td>`; }).join('')}</tr>`).join('')}</table></div>${interactive ? '<p class="small" style="color:var(--muted)">Tik op een vakje: één keer is ✗ (kan niet), twee keer is ✓ (zeker).</p>' : ''}<div class="bigq">${esc(it.subq || '')}</div>${optsHtml()}`;
      break;
    }
    default: b = optsHtml();
  }
  return b;
}

  }
  if (!r.cur) { r.cur = { t0: Date.now(), tries: 0, picks: [], removed: [], done: false, grid: {} }; save(); activity(); }
  const c = r.cur, order = r.items[r.idx].order, hints = hintsFor(it);
  const stepOn = c.done ? 3 : Math.min(c.tries, 2);
  const mark = { gone: c.picks.filter(x => x !== it.ans).concat(c.removed), right: c.done ? it.ans : null, interactive: true, locked: c.done };
  let bubble = '';
  if (c.done && c.solved) {
    const msgs = ['Top gedaan!', 'Goed bedacht!', 'Sterk, held!', 'Yes! Dat klopt.'];
    bubble = `<div class="bubble good pop"><b>${c.tries === 0 ? msgs[r.idx % msgs.length] : 'Goed zo, doorgezet!'}</b><br>+${c.xp} XP${c.coins ? ` · +${c.coins} munten` : ''}${c.dayBonus ? ' · dagbonus!' : ''}${c.streak ? ` · ${c.streak} dagen op rij, +50 XP!` : ''}</div>`;
  } else if (c.done) {
    bubble = `<div class="bubble sol pop"><b>Zo zit het</b><br>${esc(it.why)}<br><span class="muted">Deze puzzel komt later nog een keer terug. +${c.xp} XP voor het doorzetten.</span></div>`;
  } else if (c.tries > 0) {
    bubble = `<div class="bubble pop"><b>Hint ${c.tries}</b><br>${esc(hints[c.tries - 1])}</div>`;
  }
  const total = r.items.length;
  app.innerHTML = `<div class="kid">${hud(w.name + (r.boss ? ' · eindbaas' : ''), r.boss ? w.boss : w.stops[r.stop])}<div class="wrap">
    <div class="xp" style="max-width:420px;flex:none;width:100%"><div class="lab"><span>Puzzel <b>${r.idx + 1}</b> van ${total}</span>${it.bonus ? '<span style="color:var(--gold);font-weight:700">★ Bonuspuzzel</span>' : ''}</div><div class="bar"><i style="width:${Math.round(r.idx / total * 100)}%"></i></div></div>
    <div class="steps" aria-label="Denkstappen">${['KIJK', 'ZEG', 'REGEL', 'CHECK'].map((s, i) => `<span class="${i === stepOn ? 'on' : ''}">${s}</span>`).join('')}</div>
    <div class="task"><button class="iconbtn" type="button" id="say" aria-label="Lees de opdracht voor"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#38e1ff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#38e1ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><span>${esc(questionText(it))}</span></div>
    <div class="board">${puzzleBody(it, order, mark)}</div>
    ${bubble ? `<div class="hintrow"><span class="badge">${headSVG(S.kid.hero, S.kid.eq)}</span>${bubble}</div>` : ''}
    ${c.done ? `<div class="nextrow"><button class="cta" type="button" id="next">${r.idx + 1 < total ? 'Volgende puzzel' : 'Klaar!'}</button></div>` : ''}
    <div><button class="ghost" type="button" id="stopnow">Stoppen voor nu</button></div>
  </div></div>`;
  bindHud();
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { activity(); answer(+b.dataset.opt); });
  app.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => { const k = b.dataset.cell, v = c.grid[k] || ''; c.grid[k] = v === '' ? '✗' : v === '✗' ? '✓' : ''; save(); renderPlay(); });
  $('#say').onclick = () => speak(questionText(it) + (it.askline ? '. ' + it.askline : '') + (it.subq ? '. ' + it.subq : '') + (c.tries && !c.done ? '. Hint: ' + hints[c.tries - 1] : ''));
  const nx = $('#next'); if (nx) { nx.onclick = nextItem; nx.focus(); }
  $('#stopnow').onclick = () => { toast('Opgeslagen. Je gaat later precies hier verder.'); go('map'); };
}
/* Soort puzzel in detail, zodat het voorbeeld echt lijkt op de puzzel die erna komt. */
function kindOf(it) {
  switch (it.type) {
    case 'series': { const ks = it.seq.filter(Boolean).map(f => f.k); if (ks.includes('pijl')) return 'series:pijl'; if (ks.includes('raster')) return 'series:raster'; return it.seq.filter(Boolean).some(f => (f.n || 1) > 1) ? 'series:aantal' : 'series:vorm'; }
    case 'matrix': { const cells = it.grid.flat().filter(Boolean); return `matrix:${it.grid.length}x${it.grid[0].length}` + (it.grid.length > 2 && cells.some(f => (f.n || 1) > 1) ? ':aantal' : ''); }
    case 'balance': return it.facts.length === 1 ? 'balance:een' : it.facts[0][0].length > 1 ? 'balance:min' : 'balance:keten';
    case 'text': return /^Welk getal|\d+\s*·\s*\d+/.test(it.q || '') ? 'text:getallen' : 'text:woorden';
    case 'grid': return 'grid';
    default: return it.type;
  }
}

      ${b.atts.map(ai => { const a = S.attempts[ai]; if (!a) return ''; const on = !!b.stars[ai]; return reviewCard(a, `<div><button class="starbtn ${on ? 'on' : ''}" type="button" data-star="${ai}">${on ? '★ uitleg-ster' : '☆ geef uitleg-ster'}</button></div>`); }).join('')}
      <button class="pbtn dark" type="button" id="bossdone">Nakijken klaar · ${esc(KN())} krijgt ${n} uitleg-ster${n === 1 ? '' : 'ren'}</button></div>`;
  }
  body.innerHTML = `<div class="card"><h2>Eindbazen</h2><p class="small">${esc(KN())} hoeft nooit op het nakijken te wachten. De sterren en munten komen erbij zodra jullie klaar zijn, en hij krijgt een melding.</p>${list}</div>${detail}`;
  body.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { openBossIdx = +b.dataset.open; pBoss(body); const d = body.querySelector('.card:last-child'); if (d) d.scrollIntoView({ behavior: 'smooth' }); });
  body.querySelectorAll('[data-star]').forEach(btn => btn.onclick = () => { const b = S.bosses[openBossIdx]; const k = btn.dataset.star; b.stars[k] = !b.stars[k]; save(); pBoss(body); });
  const bd = $('#bossdone'); if (bd) bd.onclick = () => {
    const b = S.bosses[openBossIdx], n = Object.values(b.stars).filter(Boolean).length;
    b.reviewed = true; b.reviewedAt = Date.now();
    if (n) { addXP(25 * n); S.kid.coins += 5 * n; S.inbox.push(`Je hebt ${n} uitleg-ster${n === 1 ? '' : 'ren'} gekregen voor de eindbaas van ${worldOf(b.w).name}! +${25 * n} XP en +${5 * n} munten.`); }

/* Printen: nieuwe oefenpuzzels of eerder gespeelde puzzels, met antwoordblad */
const PR = { src: 'nieuw', n: 16, d: null, types: null, worlds: null, wrong: true, days: 14 };
function pPrint(body) {
  if (PR.d === null) PR.d = S.prog.d;
  if (!PR.types) PR.types = Object.keys(TYPE_NAMES);
  const played = [...new Set(S.attempts.map(a => a.w))].sort((a, b) => a - b);
  if (!PR.worlds) PR.worlds = played.slice();
  const wName = w => esc(worldOf(w).name) + (w >= WORLDS.length ? ` (seizoen ${Math.floor(w / WORLDS.length) + 1})` : '');
  body.innerHTML = `<div class="card"><h2>Printen</h2>
    <p>Maak een werkblad met een antwoordblad erachter. In het printvenster kies je je printer, of "Opslaan als PDF".</p>
    <div class="pform"><label><input type="radio" name="prsrc" value="nieuw" ${PR.src === 'nieuw' ? 'checked' : ''}> Nieuwe oefenpuzzels</label>
      <label><input type="radio" name="prsrc" value="oud" ${PR.src === 'oud' ? 'checked' : ''} ${played.length ? '' : 'disabled'}> Puzzels die ${esc(KN())} al gespeeld heeft</label></div>
    ${PR.src === 'nieuw' ? `
      <div class="pform"><label for="prn">Aantal</label><select id="prn">${[[8, '1 blad (8 puzzels)'], [16, '2 bladen (16 puzzels)'], [24, '3 bladen (24 puzzels)'], [40, '5 bladen (40 puzzels)']].map(([n, l]) => `<option value="${n}" ${PR.n === n ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label for="prd">Moeilijkheid</label><select id="prd">${Array.from({ length: 20 }, (_, i) => i + 1).map(d => `<option value="${d}" ${PR.d === d ? 'selected' : ''}>stap ${d} · ${weekLabel(d)}${d === S.prog.d ? ' · nu in de app' : ''}</option>`).join('')}</select></div>
      <div class="pform"><span>Soorten</span><div class="checks">${Object.entries(TYPE_NAMES).map(([k, v]) => `<label><input type="checkbox" data-type="${k}" ${PR.types.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div></div>`
    : `
      <div class="pform"><span>Werelden</span><div class="checks">${played.map(w => `<label><input type="checkbox" data-world="${w}" ${PR.worlds.includes(w) ? 'checked' : ''}> ${wName(w)}</label>`).join('')}</div></div>
      <div class="pform"><label for="prdays">Periode</label><select id="prdays">${[[7, 'afgelopen week'], [14, 'afgelopen 2 weken'], [28, 'afgelopen 4 weken'], [0, 'alles']].map(([v, l]) => `<option value="${v}" ${PR.days === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label><input type="checkbox" id="prwrong" ${PR.wrong ? 'checked' : ''}> alleen puzzels die niet meteen goed gingen</label></div>`}
    <div class="pform"><button class="pbtn dark" type="button" id="prgo">Maak werkblad</button><span class="small" id="prinfo"></span></div></div>`;
  body.querySelectorAll('[name=prsrc]').forEach(r => r.onchange = () => { PR.src = r.value; pPrint(body); });
  const on = (sel, f) => { const el = $(sel, body); if (el) el.onchange = f; };
  on('#prn', e => { PR.n = +e.target.value; });
  on('#prd', e => { PR.d = +e.target.value; });
  on('#prdays', e => { PR.days = +e.target.value; });
  on('#prwrong', e => { PR.wrong = e.target.checked; });
  body.querySelectorAll('[data-type]').forEach(c => c.onchange = () => { PR.types = [...body.querySelectorAll('[data-type]:checked')].map(x => x.dataset.type); });
  body.querySelectorAll('[data-world]').forEach(c => c.onchange = () => { PR.worlds = [...body.querySelectorAll('[data-world]:checked')].map(x => +x.dataset.world); });
  $('#prgo').onclick = () => {
    let list = [], title, sub;
    if (PR.src === 'nieuw') {
      if (!PR.types.length) { $('#prinfo').textContent = 'Kies minstens één soort puzzel.'; return; }
      const types = shuffle(PR.types);
      for (let i = 0; list.length < PR.n && i < PR.n * 3; i++) {
        const t = types[i % types.length];
        const it = GEN.make(t, PR.d, Math.floor(Math.random() * 1e9));
        if (it) list.push({ it, order: optionOrder(it) });
      }
      title = 'Oefenblad'; sub = `${list.length} puzzels`;
    } else {
      const from = PR.days ? Date.now() - PR.days * 864e5 : 0, ids = new Set();
      S.attempts.slice().sort((a, b) => b.at - a.at).forEach(a => {
        if (a.at < from || !PR.worlds.includes(a.w) || (PR.wrong && a.first) || ids.has(a.k)) return;
        const it = getItem(a.k); if (!it) return;
        ids.add(a.k); list.push({ it, order: a.order });
      });
      list = list.slice(0, 32);

    $('#prinfo').textContent = '';
    openPrint(list, title, sub);
  };
}
function answerOf(it, order) {
  const isFig = it.type === 'odd' || typeof it.opts[it.ans] === 'object';
  return isFig ? 'ABCDEFG'[order.indexOf(it.ans)] : String(it.opts[it.ans]);
}
/* Werkblad: per 8 puzzels één A4 (twee kolommen), zoals de werkbladen van het lesprogramma. Antwoorden achteraan. */
function openPrint(list, title, sub) {
  const box = $('#printout'), name = S && S.kid ? esc(S.kid.name) : '';
  const pages = []; for (let i = 0; i < list.length; i += PUZZLES_PER_STOP) pages.push(list.slice(i, i + PUZZLES_PER_STOP));
  const multi = pages.length > 1;
  const head = (n) => `<h1>Puzzelheld · ${esc(title)}${multi ? ` · blad ${n}` : ''}</h1>
      <div class="meta"><span>Naam: ${name || '________________'}</span><span>Datum: ________________</span></div>`;
  const pq = (x, i) => `<div class="pq"><h3>${i + 1}. ${esc(questionText(x.it))}</h3>
    <div class="board">${puzzleBody(x.it, x.order, { gone: [], right: null, picked: [], interactive: false, locked: true })}</div>
    <div class="ansline">Antwoord: ________</div></div>`;
  const sheets = pages.map((pg, n) => {
    const idx = pg.map((x, k) => ({ x, k: n * PUZZLES_PER_STOP + k }));
    const ordered = idx;
    return { ordered, html: `<section class="pg">${head(n + 1)}${n === 0 ? '<p class="tip">Neem je tijd. KIJK goed, ZEG hardop wat je ziet, bedenk de REGEL en CHECK je antwoord.</p>' : ''}
      <div class="pgrid">${ordered.map((o, m) => pq(o.x, n * PUZZLES_PER_STOP + m)).join('')}</div></section>` };
  });
  const ans = sheets.map((sh, n) => `${multi ? `<h2>Blad ${n + 1}</h2>` : ''}<ol start="${n * PUZZLES_PER_STOP + 1}">${sh.ordered.map(o => `<li><b>${esc(answerOf(o.x.it, o.x.order))}</b>. ${esc(o.x.it.why || '')}</li>`).join('')}</ol>`).join('');
  box.innerHTML = `<div class="pbar"><b>${esc(title)}</b><span class="small">${esc(sub)}</span><span style="flex:1"></span>
      <button class="pbtn dark" type="button" id="pr-print">Printen of opslaan als PDF</button><button class="pbtn" type="button" id="pr-close">Sluiten</button></div>
    <div class="sheet">${sheets.map(sh => sh.html).join('')}
      <div class="answers"><h1>Antwoorden</h1><p class="tip">Voor papa of mama. Kijk samen na en laat ${name || 'je kind'} uitleggen hoe hij het deed.</p>${ans}</div>
    </div>`;
  box.hidden = false; box.scrollTop = 0;
  $('#pr-print').onclick = () => window.print();
  $('#pr-close').onclick = () => { box.hidden = true; box.innerHTML = ''; };
}

    ${S && S.kid ? `<div class="card"><h2>Speler ${esc(S.kid.name)} verwijderen</h2>

  $('#sim').onclick = async () => { if (!S) { S = fresh(); R.players.push(S); } if (!S.kid) await simKid(); simulate(5); toast('5 dagen gesimuleerd.'); renderParent($('#app')); };
  $('#coins').onclick = () => { if (!S || !S.kid) { toast('Maak eerst een account voor je kind.'); return; } S.kid.coins += 300; save(); toast('300 munten gegeven.'); };
  const w = $('#wipe'); if (w) w.onclick = () => { confirmWipe = true; pTest(body); };
  const w0 = $('#wipe0'); if (w0) w0.onclick = () => { confirmWipe = false; pTest(body); };

async function simKid() {
  S.kid = { name: 'Testkind', pwHash: await hashPw('test'), hero: { skin: SKINS[2], hair: HAIRS[0], hairStyle: 'stekels', suit: SUITS[0], heroName: 'Testkind' }, eq: {}, owned: [], trophies: [], xp: 0, coins: 0, seenTypes: Object.keys(TYPE_NAMES), built: true, created: Date.now() };
}
function simulate(nDays) {
  if (!S.kid) S.kid = { name: 'Testkind', pwHash: null, hero: { skin: SKINS[2], hair: HAIRS[0], hairStyle: 'stekels', suit: SUITS[0], heroName: 'Testkind' }, eq: {}, owned: [], trophies: [], xp: 0, coins: 0, seenTypes: Object.keys(TYPE_NAMES), built: true, created: Date.now() };
  const skill = { odd: .9, series: .8, matrix: .7, analogy: .8, text: .85, balance: .5, grid: .65 };
  for (let d = nDays; d >= 1; d--) {
    const base = Date.now() - d * 864e5 + 15 * 3600e3 - (Date.now() % 864e5);
    let t = base;
    const stopsToday = S.prog.stop === 4 ? 1 : 1 + (d % 2);
    for (let s = 0; s < stopsToday; s++) {
      startStop(S.prog.stop);
      const r = S.run;
      for (r.idx = 0; r.idx < r.items.length; r.idx++) {
        const it = getItem(r.items[r.idx].id);
        const p = skill[it.type] - (it.lvl - S.prog.d) * .05;
        const opts = optionsIdx(it), wrongs = shuffle(opts.filter(i => i !== it.ans));
        const picks = []; let tries = 0;
        while (Math.random() > p && tries < 3 && wrongs.length) { picks.push(wrongs.shift()); tries++; }
        const solved = tries < 3; if (solved) picks.push(it.ans);
        const ms = 25000 + Math.random() * 70000; t += ms + 5000;
        const day = ensureDay(t); day.ms += ms; if (Math.random() < .12) day.nudges++; day.bonus = true;
        S.kid.coins += solved ? [3, 2, 1][tries] || 0 : 0; S.kid.xp += 10;
        S.seen[it.id] = { n: (S.seen[it.id] ? S.seen[it.id].n : 0) + 1, at: t };
        S.attempts.push({ k: it.id, type: it.type, lvl: it.lvl, at: t, w: r.world, s: r.stop, season: S.prog.season, boss: r.boss, picks, order: r.items[r.idx].order, first: solved && tries === 0, hints: Math.min(tries, 2), solved, ms, removed: [] });
        r.res.push({ first: solved && tries === 0, solved, hints: Math.min(tries, 2), ai: S.attempts.length - 1 });
      }
      r.idx = r.items.length;
      const n = r.res.length, pct = Math.round(r.res.filter(x => x.first).length / n * 100);
      S.kid.xp += r.boss ? 150 : 50;
      S.stops.push({ w: r.world, s: r.stop, boss: r.boss, at: t, pct, d: S.prog.d, n, first: r.res.filter(x => x.first).length, fun: 6 + Math.floor(Math.random() * 4), season: S.prog.season });
      const pg = S.prog; pg.recent.push(pct);
      if (pg.recent.length >= 2 && pg.recent.slice(-2).every(x => x > 85) && pg.d < 20) { S.events.push({ at: t, type: 'up', from: pg.d, to: pg.d + 1, pcts: pg.recent.slice(-2) }); pg.d++; pg.recent = []; }
      else if (pct < 60 && pg.d > 1) { S.events.push({ at: t, type: 'down', from: pg.d, to: pg.d - 1, pcts: [pct] }); pg.d--; pg.recent = []; }
      if (r.boss) { S.bosses.push({ w: r.world, season: pg.season, at: t, atts: r.res.map(x => x.ai), stars: {}, reviewed: false }); pg.world++; pg.stop = 0; }
      else pg.stop = r.stop + 1;
      S.run = null;
    }
  }
  save();
}

/* ===================== BOOT ===================== */
function startView() {
  const id = devGet().remember;
  view = typeof id === 'string' && pick(id) && S.kid ? (S.kid.built ? 'map' : 'builder') : 'start';
  render();
}
async function startUser() {
  KEY = 'puzzelheld-v1-' + USER.id; load();
  $('#app').innerHTML = '<p style="padding:40px;text-align:center;color:#b8c3e6">Laden…</p>';
  await pull(); startView();
}
async function boot() {
  if (!ONLINE) { load(); return startView(); }
  sb.auth.onAuthStateChange((ev, session) => {
    // geen await in deze callback (advies van Supabase); werk daarom via setTimeout
    if (ev === 'PASSWORD_RECOVERY') setTimeout(() => { USER = session.user; go('newpw'); }, 0);
    else if (ev === 'SIGNED_OUT') setTimeout(() => { USER = null; authMode = 'login'; const el = $('#sync'); if (el) el.hidden = true; go('auth'); }, 0);
  });
  let session = null;
  try { const { data } = await sb.auth.getSession(); session = data.session; } catch (e) { session = null; }
  if (view === 'newpw') return;
  if (!session) { view = 'auth'; return render(); }
  USER = session.user; await startUser();
}
boot();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { if (pushT) push(); return; }
  lastAct = Date.now();
  if (ONLINE && USER && view !== 'play' && view !== 'newpw' && view !== 'auth') { if (await pull()) { if (view !== 'p-main' && (!S || !S.kid)) view = 'start'; render(); } }
});
